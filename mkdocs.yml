site_name: DK Tech Base
site_url: https://github.com/dkang919/
repo_url: https://github.com/dkang919/tech-base
repo_name: GitHub

theme:
  name: material
  palette: 
    - scheme: default # 라이트 모드
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate # 다크 모드theme:
  name: material
  # (기존 palette 설정 유지하되, 아래 속성 추가)
  palette: 
    - scheme: default
      primary: teal   # 추천: teal, indigo, slate, black
      accent: purple  # 버튼 등 포인트 컬러
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs # 상단 탭 메뉴 (프로페셔널한 느낌)
    - navigation.sections
    - navigation.top # 위로 가기 버튼
    - content.code.copy # 코드 복사 버튼

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition            # [필수] 박스 기능
  - pymdownx.details      # [필수] 접었다 폈다 하는 기능
  - pymdownx.arithmatex:  # [필수] 수식 기능 ($E=mc^2$)
      generic: true
  - pymdownx.tabbed:      # [Journal] 한국어/English 탭 전환
      alternate_style: true

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/boids.js

extra_css:
  - stylesheets/extra.css

# 사이트 빌드에서 제외 (파일은 저장소에 그대로 남음)
# Why: nav에서 뺀 문서가 URL로는 계속 열리는 상황을 막기 위함
exclude_docs: |
  daily-table-topics-app/
  aar/
  taste/
  journal/_template.md

# nav에 없는 것이 의도된 경로 (--strict 빌드 경고 억제)
# Why: journal의 월/일자 글은 nav 대신 index.md 링크로 탐색함
not_in_nav: |
  journal/

nav:
  - Home: index.md
  - Journal:
      - Overview: journal/index.md
  - Canada PC Parts Tracker:
      - Intro: canada-pc-parts-tracker/ca-pc-parts-tracker.md   
  - Finished Projects:
      - Canada IEC Monitor (2025-12): finished-projects/iec-monitor.md
  - Study:
      - Practice with Gemini: study/notes.md
      - Evaluation Metrics: study/evaluation_metrics.md
      - A/B Testing: study/ab-testing.md
      - Logistic Regression: study/logistic_regression.md
      - Decision Trees: study/decision_tree.md
      - Random Forest: study/random_forest.md
      - Principal Component Analysis: study/pca.md
      - K - Means: study/k-means.md
      - Flash Cards: study/quiz/ml-quiz.md

extra:
