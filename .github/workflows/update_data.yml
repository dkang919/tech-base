name: Update BigQuery Data Chart

on:
  schedule:
    # UTC 일요일 오전 2시 (캐나다 EST 토요일 오후 9시)
    - cron: '0 2 * * 0'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  update-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # [수정됨] Secret 내용을 꺼내서 임시 json 파일 생성
      - name: Create credentials file
        shell: bash
        env:
          GCP_KEY: ${{ secrets.GCP_SA_KEY }}
        run: echo "$GCP_KEY" > gcp-key.json

      # 2. 파이썬 실행 단계 (여기가 중요! 변수명은 꼭 GOOGLE_... 이어야 함)
      - name: Generate Chart
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp-key.json
        run: | 
          ls -la gcp-key.json  # 파일 있는지 확인용
          python scripts/generate_charts.py

      # [추가됨] 보안을 위해 사용 후 즉시 삭제 (성공/실패 무관하게 실행)
      - name: Delete credentials file
        if: always()
        run: rm gcp-key.json

      # [기존 코드] 변경사항 커밋 및 푸시
      - name: Commit and Push changes
        id: commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 차트 파일명이 늘어도 따라가도록 폴더 단위로 담는다
          git add docs/images
          if git diff --cached --quiet; then
            echo "변경 없음"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Auto-update: Price charts"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

    outputs:
      changed: ${{ steps.commit.outputs.changed }}

  # Why: GITHUB_TOKEN으로 한 push는 다른 워크플로를 발동시키지 않으므로
  #      deploy.yml 의 push 트리거에 기댈 수 없다. 직접 호출한다.
  deploy:
    needs: update-chart
    if: needs.update-chart.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write