name: Sync Journal from Notion

on:
  schedule:
    # UTC 21:00 = 캐나다 EDT 17:00 / EST 16:00 (매일 1회)
    - cron: '0 21 * * *'
  workflow_dispatch: # 수동 실행 버튼

# Why: 동시에 두 번 돌면 같은 파일을 두고 push가 충돌한다.
concurrency:
  group: sync-journal
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Why: 전체 requirements.txt는 BigQuery/matplotlib까지 들어있어 느리다.
      #      이 워크플로에 실제로 필요한 건 두 개뿐.
      - name: Install dependencies
        run: pip install requests PyYAML

      - name: Sync from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python tools/sync_journal.py

      - name: Commit and push if changed
        id: commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/journal
          # 변경이 없으면 여기서 조용히 끝난다 (실패가 아님)
          if git diff --cached --quiet; then
            echo "변경 없음"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Auto-sync: journal from Notion"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Why: GITHUB_TOKEN으로 한 push는 다른 워크플로를 발동시키지 않는다.
      #      (워크플로가 서로를 무한히 깨우는 것을 막는 GitHub 정책)
      #      따라서 publish.yml 이 깨어나지 않으므로 여기서 직접 배포한다.
      #      update_data.yml 도 같은 이유로 같은 방식을 쓰고 있다.
      - name: Deploy site
        if: steps.commit.outputs.changed == 'true'
        run: |
          pip install mkdocs-material
          mkdocs gh-deploy --force
